# Build, test and publish the timeline-scope image.
#
# Nothing is published unless the ported test suite passes: this job is the only gate
# between an automatic upstream rebase and the family instance (D6, T1).
name: timeline-scope build

on:
  push:
    branches: [timeline-scope]
  workflow_dispatch:

concurrency:
  group: timeline-scope-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the patch version
        id: version
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . timeline-scope/upstream.env
          echo "image_tag=${UPSTREAM_TAG}-timeline-scope.${PATCH_REVISION}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a tag that already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.image_tag }}'
          if gh api "users/${{ github.repository_owner }}/packages/container/immich-server-timeline-scope/versions" \
               --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -Fxq "$tag"; then
            echo "::error::${tag} is already published. Bump PATCH_REVISION in timeline-scope/upstream.env."
            exit 1
          fi

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # server/src imports @immich/plugin-sdk and web/e2e import @immich/sdk from source: neither
      # resolves until these workspace packages are built. Upstream's own server:ci-unit task
      # (server/mise.toml) runs this same //:plugins task before `tsc --noEmit` for the same reason.
      - name: Build workspace packages (@immich/sdk, @immich/plugin-sdk, @immich/plugin-core)
        run: mise run //:plugins

      - name: Typecheck and lint the patched surfaces
        run: |
          pnpm --filter immich run check
          pnpm --filter immich-web run check:typescript
          pnpm --filter immich-web run check:svelte

      - name: Server unit tests
        run: pnpm --filter immich run test

      - name: End-to-end tests
        run: mise //e2e:test

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/catskan/immich-server-timeline-scope:${{ steps.version.outputs.image_tag }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_REF=timeline-scope
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
