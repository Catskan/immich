# Build, test and publish the timeline-scope image.
#
# Nothing is published unless the ported test suite passes: this job is the only gate
# between an automatic upstream rebase and the family instance (D6, T1).
name: timeline-scope build

on:
  push:
    branches: [timeline-scope]
  workflow_dispatch:

concurrency:
  group: timeline-scope-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the patch version
        id: version
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . timeline-scope/upstream.env
          echo "image_tag=${UPSTREAM_TAG}-timeline-scope.${PATCH_REVISION}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a tag that already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.image_tag }}'
          if gh api "users/${{ github.repository_owner }}/packages/container/immich-server-timeline-scope/versions" \
               --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -Fxq "$tag"; then
            echo "::error::${tag} is already published. Bump PATCH_REVISION in timeline-scope/upstream.env."
            exit 1
          fi

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint the patched surfaces
        run: |
          pnpm --filter immich run check
          pnpm --filter immich-web run check:typescript
          pnpm --filter immich-web run check:svelte

      - name: Server unit tests
        run: pnpm --filter immich run test

      - name: End-to-end tests
        run: mise //e2e:test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/immich-server-timeline-scope:${{ steps.version.outputs.image_tag }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_REF=timeline-scope
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
